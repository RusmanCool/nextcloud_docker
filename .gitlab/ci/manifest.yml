manifest_image:
  stage: manifest
  image: alpine:3.21
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $BUILD_NEXTCLOUD_IMAGE == "true"'
      when: on_success
    - when: never
  needs:
    - job: verify_release
      artifacts: true
    - job: build_nextcloud_image
      artifacts: true
  before_script:
    - apk add --no-cache bash coreutils
  script:
    - |
      if [ "$PUBLISH_IMAGE" = "true" ]; then
        export MANIFEST_TYPE=published
        export MANIFEST_PATH=artifacts/nextcloud-image-manifest.yaml
      else
        export MANIFEST_TYPE=validation
        export MANIFEST_PATH=artifacts/nextcloud-image-validation.yaml
      fi
    - set -a
    - . artifacts/release/release.env
    - . artifacts/build/build.env
    - set +a
    - export SOURCE_PROJECT="${CI_PROJECT_PATH:-hn583/nextcloud_docker}"
    - export SOURCE_COMMIT="$CI_COMMIT_SHA"
    - export SOURCE_REF="$CI_COMMIT_REF_NAME"
    - ./ci/generate-manifest.sh
  artifacts:
    when: on_success
    paths:
      - artifacts/nextcloud-image*.yaml
