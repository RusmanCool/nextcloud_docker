verify_release:
  stage: verify_release
  image: alpine:3.21
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $BUILD_NEXTCLOUD_IMAGE == "true"'
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache bash coreutils curl gnupg
  script:
    - ./ci/verify-release.sh
  artifacts:
    when: on_success
    reports:
      dotenv: artifacts/release/release.env
    paths:
      - artifacts/release/release.env
      - artifacts/release/release-verification.yaml
      - artifacts/release/nextcloud-*.tar.bz2
      - artifacts/release/nextcloud-*.tar.bz2.asc
      - artifacts/release/nextcloud-*.tar.bz2.sha256
      - artifacts/release/nextcloud.asc

build_nextcloud_image:
  extends: .docker_socket
  stage: nextcloud
  resource_group: dockerhub-nextcloud-publish
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $BUILD_NEXTCLOUD_IMAGE == "true"'
      when: on_success
    - when: never
  needs:
    - job: verify_release
      artifacts: true
    - job: runtime_image
      artifacts: true
      optional: true
    - job: release_verifier_image
      artifacts: true
      optional: true
  script:
    - mkdir -p artifacts/build artifacts/image
    - |
      if [ "$USE_RUNTIME_IMAGE" = "true" ]; then
        test -n "${RUNTIME_IMAGE_REF:-}" || { echo "USE_RUNTIME_IMAGE=true but runtime_image did not provide RUNTIME_IMAGE_REF." >&2; exit 1; }
        test -s "${RUNTIME_IMAGE_ARCHIVE:-}" || { echo "Runtime image archive is missing: ${RUNTIME_IMAGE_ARCHIVE:-unset}" >&2; exit 1; }
        docker load -i "$RUNTIME_IMAGE_ARCHIVE"
      else
        export RUNTIME_IMAGE_REF="${RUNTIME_IMAGE_REPOSITORY}:${RUNTIME_IMAGE_TAG}"
      fi
    - |
      if [ "$USE_RELEASE_VERIFIER_IMAGE" = "true" ]; then
        test -n "${RELEASE_VERIFIER_IMAGE_REF:-}" || { echo "USE_RELEASE_VERIFIER_IMAGE=true but release_verifier_image did not provide RELEASE_VERIFIER_IMAGE_REF." >&2; exit 1; }
        test -s "${RELEASE_VERIFIER_IMAGE_ARCHIVE:-}" || { echo "Release verifier image archive is missing: ${RELEASE_VERIFIER_IMAGE_ARCHIVE:-unset}" >&2; exit 1; }
        docker load -i "$RELEASE_VERIFIER_IMAGE_ARCHIVE"
      else
        export RELEASE_VERIFIER_IMAGE_REF="${RELEASE_VERIFIER_IMAGE_REPOSITORY}:${RELEASE_VERIFIER_IMAGE_TAG}"
      fi
    - rm -rf "$DOCKER_CONTEXT/release"
    - mkdir -p "$DOCKER_CONTEXT/release"
    - cp "artifacts/release/nextcloud-${NEXTCLOUD_VERSION}.tar.bz2" "$DOCKER_CONTEXT/release/nextcloud.tar.bz2"
    - cp "artifacts/release/nextcloud-${NEXTCLOUD_VERSION}.tar.bz2.asc" "$DOCKER_CONTEXT/release/nextcloud.tar.bz2.asc"
    - cp "artifacts/release/nextcloud-${NEXTCLOUD_VERSION}.tar.bz2.sha256" "$DOCKER_CONTEXT/release/nextcloud.tar.bz2.sha256"
    - cp artifacts/release/nextcloud.asc "$DOCKER_CONTEXT/release/nextcloud.asc"
    - export LOCAL_IMAGE_REF="nextcloud-ci:${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
    - docker build --build-arg NEXTCLOUD_PHP_RUNTIME_IMAGE="$RUNTIME_IMAGE_REF" --build-arg NEXTCLOUD_RELEASE_VERIFIER_IMAGE="$RELEASE_VERIFIER_IMAGE_REF" --build-arg NEXTCLOUD_SHA256="$NEXTCLOUD_SHA256" --build-arg NEXTCLOUD_GPG_FINGERPRINT="$NEXTCLOUD_GPG_FINGERPRINT" --label "org.opencontainers.image.source=$CI_PROJECT_URL" --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" --label "org.opencontainers.image.version=$NEXTCLOUD_VERSION" -t "$LOCAL_IMAGE_REF" -f "$DOCKERFILE_PATH" "$DOCKER_CONTEXT"
    - IMAGE_REF="$LOCAL_IMAGE_REF" ./ci/smoke-test.sh
    - export IMAGE_TAG="${NEXTCLOUD_VERSION}-houselab.${CI_PIPELINE_ID}"
    - export IMAGE_DIGEST=""
    - |
      is_dockerhub_ref() {
        ref_without_tag="${1%%:*}"
        first_segment="${ref_without_tag%%/*}"

        case "$first_segment" in
          *.*|*:*|localhost) return 1 ;;
          *) return 0 ;;
        esac
      }

      if [ "$PUBLISH_IMAGE" = "true" ]; then
        test -n "${DOCKERHUB_USERNAME:-}" || { echo "DOCKERHUB_USERNAME is required for publishing." >&2; exit 1; }
        test -n "${DOCKERHUB_TOKEN:-}" || { echo "DOCKERHUB_TOKEN is required for publishing." >&2; exit 1; }
        if [ "$USE_RUNTIME_IMAGE" = "true" ] && [ -z "${RUNTIME_IMAGE_DIGEST:-}" ]; then
          echo "Runtime image must have a Docker Hub digest before publishing the Nextcloud app image." >&2
          exit 1
        fi
        if [ "$USE_RELEASE_VERIFIER_IMAGE" = "true" ] && [ -z "${RELEASE_VERIFIER_IMAGE_DIGEST:-}" ]; then
          echo "Release verifier image must have a Docker Hub digest before publishing the Nextcloud app image." >&2
          exit 1
        fi
        docker tag "$LOCAL_IMAGE_REF" "$IMAGE_REPOSITORY:$IMAGE_TAG"
        printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
        docker push "$IMAGE_REPOSITORY:$IMAGE_TAG"
        is_dockerhub_ref "$IMAGE_REPOSITORY:$IMAGE_TAG" || { echo "Digest resolution with docker buildx imagetools inspect is only supported for Docker Hub refs: $IMAGE_REPOSITORY:$IMAGE_TAG" >&2; exit 1; }
        IMAGE_DIGEST="$(docker buildx imagetools inspect "$IMAGE_REPOSITORY:$IMAGE_TAG" | awk '$1 == "Digest:" { print $2; exit }')"
        test -n "$IMAGE_DIGEST" || { echo "Unable to resolve pushed image digest for $IMAGE_REPOSITORY:$IMAGE_TAG" >&2; exit 1; }
      fi
    - |
      {
        echo "LOCAL_IMAGE_REF=$LOCAL_IMAGE_REF"
        echo "IMAGE_TAG=$IMAGE_TAG"
        echo "IMAGE_DIGEST=$IMAGE_DIGEST"
        echo "IMAGE_REF=$IMAGE_REPOSITORY:$IMAGE_TAG"
        echo "RUNTIME_IMAGE_REF=${RUNTIME_IMAGE_REF:-}"
        echo "RUNTIME_IMAGE_DIGEST=${RUNTIME_IMAGE_DIGEST:-}"
        echo "RELEASE_VERIFIER_IMAGE_REF=${RELEASE_VERIFIER_IMAGE_REF:-}"
        echo "RELEASE_VERIFIER_IMAGE_DIGEST=${RELEASE_VERIFIER_IMAGE_DIGEST:-}"
        echo "SMOKE_TESTS_PASSED=true"
      } > artifacts/build/build.env
  artifacts:
    when: on_success
    reports:
      dotenv: artifacts/build/build.env
    paths:
      - artifacts/build/build.env
