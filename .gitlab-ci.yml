workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never

stages:
  - static
  - verify_release
  - build_smoke
  - publish
  - manifest

default:
  tags:
    - homenas-docker-image-build

variables:
  PUBLISH_IMAGE:
    value: "false"
    options:
      - "false"
      - "true"
    description: "Publish one environment-neutral Docker Hub build artifact tag and manifest."
  DOCKER_BUILDKIT: "1"
  NEXTCLOUD_VERSION: "34.0.0"
  IMAGE_REPOSITORY: "rusman/nextcloud_cron_fmp"
  DOCKER_CONTEXT: "34/fpm"
  DOCKERFILE_PATH: "34/fpm/Dockerfile"
  RUNTIME_IMAGE_REPOSITORY: "rusman/nextcloud_php_runtime"
  RUNTIME_IMAGE_TAG: "8.2-bookworm"
  RUNTIME_DOCKER_CONTEXT: ""
  RUNTIME_DOCKERFILE_PATH: ""
  RELEASE_URL: "https://download.nextcloud.com/server/releases/nextcloud-34.0.0.tar.bz2"
  RELEASE_ASC_URL: "https://download.nextcloud.com/server/releases/nextcloud-34.0.0.tar.bz2.asc"
  RELEASE_SHA256_URL: "https://download.nextcloud.com/server/releases/nextcloud-34.0.0.tar.bz2.sha256"
  NEXTCLOUD_GPG_KEY_URL: "https://nextcloud.com/nextcloud.asc"
  NEXTCLOUD_GPG_FINGERPRINT: "28806A878AE423A28372792ED75899B9A724937A"

.docker_socket:
  image: docker:27.5.1
  before_script:
    - apk add --no-cache bash coreutils curl gnupg gzip
    - test -S /var/run/docker.sock || { echo "Docker socket runner is required at /var/run/docker.sock." >&2; exit 1; }
    - docker version

static_syntax:
  stage: static
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash
  script:
    - bash -n ci/*.sh
    - test -f "$DOCKERFILE_PATH"
    - if [ -n "$RUNTIME_DOCKER_CONTEXT" ]; then test -f "$RUNTIME_DOCKERFILE_PATH"; fi
    - sh -n "$DOCKER_CONTEXT"/*.sh

verify_release:
  stage: verify_release
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash coreutils curl gnupg
  script:
    - ./ci/verify-release.sh
  artifacts:
    when: on_success
    reports:
      dotenv: artifacts/release/release.env
    paths:
      - artifacts/release/release.env
      - artifacts/release/release-verification.yaml
      - artifacts/release/nextcloud-*.tar.bz2
      - artifacts/release/nextcloud-*.tar.bz2.asc
      - artifacts/release/nextcloud-*.tar.bz2.sha256
      - artifacts/release/nextcloud.asc

build_smoke:
  extends: .docker_socket
  stage: build_smoke
  needs:
    - job: verify_release
      artifacts: true
  script:
    - mkdir -p artifacts/build artifacts/image
    - touch artifacts/image/.keep
    - |
      if [ -n "$RUNTIME_DOCKER_CONTEXT" ]; then
        test -f "$RUNTIME_DOCKERFILE_PATH" || { echo "RUNTIME_DOCKERFILE_PATH is required when RUNTIME_DOCKER_CONTEXT is set." >&2; exit 1; }
        export RUNTIME_IMAGE_REF="${RUNTIME_IMAGE_REPOSITORY}:${RUNTIME_IMAGE_TAG}"
        echo "Building Nextcloud PHP runtime image: $RUNTIME_IMAGE_REF"
        docker build --pull --label "org.opencontainers.image.source=$CI_PROJECT_URL" --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" -t "$RUNTIME_IMAGE_REF" -f "$RUNTIME_DOCKERFILE_PATH" "$RUNTIME_DOCKER_CONTEXT"
      else
        export RUNTIME_IMAGE_REF=""
      fi
    - rm -rf "$DOCKER_CONTEXT/release"
    - mkdir -p "$DOCKER_CONTEXT/release"
    - cp "artifacts/release/nextcloud-${NEXTCLOUD_VERSION}.tar.bz2" "$DOCKER_CONTEXT/release/nextcloud.tar.bz2"
    - cp "artifacts/release/nextcloud-${NEXTCLOUD_VERSION}.tar.bz2.asc" "$DOCKER_CONTEXT/release/nextcloud.tar.bz2.asc"
    - cp "artifacts/release/nextcloud-${NEXTCLOUD_VERSION}.tar.bz2.sha256" "$DOCKER_CONTEXT/release/nextcloud.tar.bz2.sha256"
    - cp artifacts/release/nextcloud.asc "$DOCKER_CONTEXT/release/nextcloud.asc"
    - export LOCAL_IMAGE_REF="nextcloud-ci:${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
    - docker build --pull --build-arg NEXTCLOUD_PHP_RUNTIME_IMAGE="${RUNTIME_IMAGE_REPOSITORY}:${RUNTIME_IMAGE_TAG}" --build-arg NEXTCLOUD_SHA256="$NEXTCLOUD_SHA256" --build-arg NEXTCLOUD_GPG_FINGERPRINT="$NEXTCLOUD_GPG_FINGERPRINT" --label "org.opencontainers.image.source=$CI_PROJECT_URL" --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" --label "org.opencontainers.image.version=$NEXTCLOUD_VERSION" -t "$LOCAL_IMAGE_REF" -f "$DOCKERFILE_PATH" "$DOCKER_CONTEXT"
    - IMAGE_REF="$LOCAL_IMAGE_REF" ./ci/smoke-test.sh
    - |
      {
        echo "LOCAL_IMAGE_REF=$LOCAL_IMAGE_REF"
        echo "BUILD_IMAGE_ARCHIVE=artifacts/image/nextcloud-image.tar.gz"
        echo "RUNTIME_IMAGE_REF=$RUNTIME_IMAGE_REF"
        echo "RUNTIME_IMAGE_ARCHIVE=artifacts/image/nextcloud-php-runtime.tar.gz"
        echo "SMOKE_TESTS_PASSED=true"
      } > artifacts/build/build.env
    - |
      if [ "$PUBLISH_IMAGE" = "true" ]; then
        if [ -n "$RUNTIME_IMAGE_REF" ]; then
          docker save "$RUNTIME_IMAGE_REF" | gzip -c > artifacts/image/nextcloud-php-runtime.tar.gz
        fi
        docker save "$LOCAL_IMAGE_REF" | gzip -c > artifacts/image/nextcloud-image.tar.gz
      else
        echo "PUBLISH_IMAGE is false; skipping image archive artifact for validation-only run."
      fi
  artifacts:
    when: on_success
    reports:
      dotenv: artifacts/build/build.env
    paths:
      - artifacts/build/build.env
      - artifacts/image/

publish_image:
  extends: .docker_socket
  stage: publish
  resource_group: dockerhub-nextcloud-publish
  needs:
    - job: verify_release
      artifacts: true
    - job: build_smoke
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $PUBLISH_IMAGE == "true"'
      when: on_success
    - when: never
  script:
    - test "$PUBLISH_IMAGE" = "true"
    - test -n "${DOCKERHUB_USERNAME:-}" || { echo "DOCKERHUB_USERNAME is required for publishing." >&2; exit 1; }
    - test -n "${DOCKERHUB_TOKEN:-}" || { echo "DOCKERHUB_TOKEN is required for publishing." >&2; exit 1; }
    - |
      validate_plain_tag() {
        case "$1" in
          ""|[Ll][Aa][Tt][Ee][Ss][Tt]|*/*|*:*)
            echo "Image tags must be plain non-latest Docker tags." >&2
            exit 1
            ;;
        esac
      }

      export IMAGE_TAG="${NEXTCLOUD_VERSION}-houselab.${CI_PIPELINE_ID}"
      validate_plain_tag "$IMAGE_TAG"
      echo "Publish configuration:"
      echo "  image_repository=$IMAGE_REPOSITORY"
      echo "  image_tag=$IMAGE_TAG"
      echo "  nextcloud_version=$NEXTCLOUD_VERSION"
      echo "  build_image_archive=$BUILD_IMAGE_ARCHIVE"
    - test -s "$BUILD_IMAGE_ARCHIVE" || { echo "Build image archive is missing; cannot publish the smoke-tested image." >&2; exit 1; }
    - if [ -n "$RUNTIME_IMAGE_REF" ]; then test -s "$RUNTIME_IMAGE_ARCHIVE" || { echo "Runtime image archive is missing; cannot publish the runtime image." >&2; exit 1; }; fi
    - echo "Loading smoke-tested image archive from $BUILD_IMAGE_ARCHIVE"
    - docker load -i "$BUILD_IMAGE_ARCHIVE"
    - |
      if [ -n "$RUNTIME_IMAGE_REF" ]; then
        echo "Loading runtime image archive from $RUNTIME_IMAGE_ARCHIVE"
        docker load -i "$RUNTIME_IMAGE_ARCHIVE"
      fi
    - echo "Docker tag to publish:"
    - echo "  $IMAGE_REPOSITORY:$IMAGE_TAG"
    - if [ -n "$RUNTIME_IMAGE_REF" ]; then echo "  $RUNTIME_IMAGE_REF"; fi
    - docker tag "$LOCAL_IMAGE_REF" "$IMAGE_REPOSITORY:$IMAGE_TAG"
    - echo "Logging in to Docker Hub as $DOCKERHUB_USERNAME"
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - |
      if [ -n "$RUNTIME_IMAGE_REF" ]; then
        echo "Pushing $RUNTIME_IMAGE_REF"
        docker push "$RUNTIME_IMAGE_REF"
        export PUBLISHED_RUNTIME_IMAGE_REF="$RUNTIME_IMAGE_REF"
      else
        export PUBLISHED_RUNTIME_IMAGE_REF=""
      fi
    - echo "Pushing $IMAGE_REPOSITORY:$IMAGE_TAG"
    - docker push "$IMAGE_REPOSITORY:$IMAGE_TAG"
    - echo "Verifying published Docker Hub digests"
    - ./ci/verify-published-digest.sh
    - |
      cleanup_refs="$LOCAL_IMAGE_REF $IMAGE_REPOSITORY:$IMAGE_TAG"
      if [ -n "$RUNTIME_IMAGE_REF" ]; then
        cleanup_refs="$cleanup_refs $RUNTIME_IMAGE_REF"
      fi
      echo "Removing local image refs after verified publish: $cleanup_refs"
      docker image rm $cleanup_refs
  artifacts:
    when: on_success
    reports:
      dotenv: artifacts/image.env
    paths:
      - artifacts/image.env

manifest_validation:
  stage: manifest
  image: alpine:3.21
  needs:
    - job: verify_release
      artifacts: true
    - job: build_smoke
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $PUBLISH_IMAGE == "false"'
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache bash coreutils
  script:
    - export MANIFEST_TYPE=validation
    - set -a
    - . artifacts/release/release.env
    - . artifacts/build/build.env
    - set +a
    - export MANIFEST_PATH=artifacts/nextcloud-image-validation.yaml
    - export IMAGE_TAG="${NEXTCLOUD_VERSION}-houselab.${CI_PIPELINE_ID}"
    - export SOURCE_PROJECT="${CI_PROJECT_PATH:-hn583/nextcloud_docker}"
    - export SOURCE_COMMIT="$CI_COMMIT_SHA"
    - export SOURCE_REF="$CI_COMMIT_REF_NAME"
    - ./ci/generate-manifest.sh
  artifacts:
    when: on_success
    paths:
      - artifacts/nextcloud-image*.yaml

manifest_published:
  stage: manifest
  image: alpine:3.21
  needs:
    - job: verify_release
      artifacts: true
    - job: build_smoke
      artifacts: true
    - job: publish_image
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $PUBLISH_IMAGE == "true"'
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache bash coreutils
  script:
    - export MANIFEST_TYPE=published
    - set -a
    - . artifacts/release/release.env
    - . artifacts/build/build.env
    - . artifacts/image.env
    - set +a
    - export MANIFEST_PATH=artifacts/nextcloud-image-manifest.yaml
    - export SOURCE_PROJECT="${CI_PROJECT_PATH:-hn583/nextcloud_docker}"
    - export SOURCE_COMMIT="$CI_COMMIT_SHA"
    - export SOURCE_REF="$CI_COMMIT_REF_NAME"
    - ./ci/generate-manifest.sh
  artifacts:
    when: on_success
    paths:
      - artifacts/nextcloud-image*.yaml
