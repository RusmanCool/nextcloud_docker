workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web"'
      when: always
    - when: never

stages:
  - static
  - verify_release
  - build_smoke
  - publish
  - manifest

default:
  tags:
    - homenas-docker-image-build

variables:
  PUBLISH_IMAGE:
    value: "false"
    options:
      - "false"
      - "true"
    description: "Publish Docker Hub tags and production manifest."
  IMAGE_TAG:
    value: "34.0.0"
    description: "Plain Docker Hub release tag. Used only when publishing."
  PUBLISH_IMMUTABLE_TAGS:
    value: "true"
    options:
      - "true"
      - "false"
    description: "Also publish trace tags using pipeline ID and commit SHA."
  DEPLOYMENT_ENV:
    value: "qa"
    options:
      - "qa"
      - "prod"
    description: "Deployment lane for the published manifest and tag policy."
  QA_IMAGE_TAG:
    value: "34.0.0-qa"
    description: "Mutable QA Docker tag. Used only when DEPLOYMENT_ENV=qa and publishing."
  DOCKER_BUILDKIT: "1"
  NEXTCLOUD_VERSION: "34.0.0"
  IMAGE_REPOSITORY: "rusman/nextcloud_cron_fmp"
  DOCKER_CONTEXT: "34/fpm"
  DOCKERFILE_PATH: "34/fpm/Dockerfile"
  RELEASE_URL: "https://download.nextcloud.com/server/releases/nextcloud-34.0.0.tar.bz2"
  RELEASE_ASC_URL: "https://download.nextcloud.com/server/releases/nextcloud-34.0.0.tar.bz2.asc"
  RELEASE_SHA256_URL: "https://download.nextcloud.com/server/releases/nextcloud-34.0.0.tar.bz2.sha256"
  NEXTCLOUD_GPG_KEY_URL: "https://nextcloud.com/nextcloud.asc"
  NEXTCLOUD_GPG_FINGERPRINT: "28806A878AE423A28372792ED75899B9A724937A"

.docker_socket:
  image: docker:27.5.1
  before_script:
    - apk add --no-cache bash coreutils curl gnupg gzip
    - test -S /var/run/docker.sock || { echo "Docker socket runner is required at /var/run/docker.sock." >&2; exit 1; }
    - docker version

static_syntax:
  stage: static
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash
  script:
    - bash -n ci/*.sh
    - sh -n 34/fpm/*.sh

verify_release:
  stage: verify_release
  image: alpine:3.21
  before_script:
    - apk add --no-cache bash coreutils curl gnupg
  script:
    - ./ci/verify-release.sh
  artifacts:
    when: on_success
    reports:
      dotenv: artifacts/release/release.env
    paths:
      - artifacts/release/release.env
      - artifacts/release/release-verification.yaml
      - artifacts/release/nextcloud-*.tar.bz2
      - artifacts/release/nextcloud-*.tar.bz2.asc
      - artifacts/release/nextcloud-*.tar.bz2.sha256
      - artifacts/release/nextcloud.asc

build_smoke:
  extends: .docker_socket
  stage: build_smoke
  needs:
    - job: verify_release
      artifacts: true
  script:
    - mkdir -p artifacts/build artifacts/image
    - touch artifacts/image/.keep
    - rm -rf "$DOCKER_CONTEXT/release"
    - mkdir -p "$DOCKER_CONTEXT/release"
    - cp "artifacts/release/nextcloud-${NEXTCLOUD_VERSION}.tar.bz2" "$DOCKER_CONTEXT/release/nextcloud.tar.bz2"
    - cp "artifacts/release/nextcloud-${NEXTCLOUD_VERSION}.tar.bz2.asc" "$DOCKER_CONTEXT/release/nextcloud.tar.bz2.asc"
    - cp "artifacts/release/nextcloud-${NEXTCLOUD_VERSION}.tar.bz2.sha256" "$DOCKER_CONTEXT/release/nextcloud.tar.bz2.sha256"
    - cp artifacts/release/nextcloud.asc "$DOCKER_CONTEXT/release/nextcloud.asc"
    - export LOCAL_IMAGE_REF="nextcloud-ci:${CI_PIPELINE_ID}-${CI_COMMIT_SHORT_SHA}"
    - docker build --pull --build-arg NEXTCLOUD_SHA256="$NEXTCLOUD_SHA256" --build-arg NEXTCLOUD_GPG_FINGERPRINT="$NEXTCLOUD_GPG_FINGERPRINT" --label "org.opencontainers.image.source=$CI_PROJECT_URL" --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" --label "org.opencontainers.image.version=$NEXTCLOUD_VERSION" -t "$LOCAL_IMAGE_REF" -f "$DOCKERFILE_PATH" "$DOCKER_CONTEXT"
    - IMAGE_REF="$LOCAL_IMAGE_REF" ./ci/smoke-test.sh
    - |
      {
        echo "LOCAL_IMAGE_REF=$LOCAL_IMAGE_REF"
        echo "BUILD_IMAGE_ARCHIVE=artifacts/image/nextcloud-image.tar.gz"
        echo "SMOKE_TESTS_PASSED=true"
      } > artifacts/build/build.env
    - |
      if [ "$PUBLISH_IMAGE" = "true" ]; then
        docker save "$LOCAL_IMAGE_REF" | gzip -c > artifacts/image/nextcloud-image.tar.gz
      else
        echo "PUBLISH_IMAGE is false; skipping image archive artifact for validation-only run."
      fi
  artifacts:
    when: on_success
    reports:
      dotenv: artifacts/build/build.env
    paths:
      - artifacts/build/build.env
      - artifacts/image/

publish_image:
  extends: .docker_socket
  stage: publish
  resource_group: dockerhub-nextcloud-publish
  needs:
    - job: verify_release
      artifacts: true
    - job: build_smoke
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $PUBLISH_IMAGE == "true"'
      when: on_success
    - when: never
  script:
    - test "$PUBLISH_IMAGE" = "true"
    - test -n "${DOCKERHUB_USERNAME:-}" || { echo "DOCKERHUB_USERNAME is required for publishing." >&2; exit 1; }
    - test -n "${DOCKERHUB_TOKEN:-}" || { echo "DOCKERHUB_TOKEN is required for publishing." >&2; exit 1; }
    - |
      case "$DEPLOYMENT_ENV" in
        qa|prod) ;;
        *)
          echo "DEPLOYMENT_ENV must be qa or prod." >&2
          exit 1
          ;;
      esac
    - |
      case "$PUBLISH_IMMUTABLE_TAGS" in
        true|false) ;;
        *)
          echo "PUBLISH_IMMUTABLE_TAGS must be true or false." >&2
          exit 1
          ;;
      esac
    - |
      validate_plain_tag() {
        case "$1" in
          ""|[Ll][Aa][Tt][Ee][Ss][Tt]|*/*|*:*)
            echo "Image tags must be plain non-latest Docker tags." >&2
            exit 1
            ;;
        esac
      }

      if [ "$DEPLOYMENT_ENV" = "prod" ]; then
        validate_plain_tag "$IMAGE_TAG"
        test "$IMAGE_TAG" = "$NEXTCLOUD_VERSION" || { echo "PROD IMAGE_TAG must match NEXTCLOUD_VERSION for release publishing." >&2; exit 1; }
      else
        export IMAGE_TAG="${QA_IMAGE_TAG:-${NEXTCLOUD_VERSION}-qa}"
        validate_plain_tag "$IMAGE_TAG"
        test "$IMAGE_TAG" != "$NEXTCLOUD_VERSION" || { echo "QA_IMAGE_TAG must not equal the PROD release tag." >&2; exit 1; }
        case "$IMAGE_TAG" in
          *[Qq][Aa]*) ;;
          *)
            echo "QA_IMAGE_TAG must clearly identify QA." >&2
            exit 1
            ;;
        esac
      fi
    - test -s "$BUILD_IMAGE_ARCHIVE" || { echo "Build image archive is missing; cannot publish the smoke-tested image." >&2; exit 1; }
    - docker load -i "$BUILD_IMAGE_ARCHIVE"
    - export IMMUTABLE_IMAGE_TAG=""
    - export PIPELINE_IMAGE_TAG=""
    - |
      if [ "$PUBLISH_IMMUTABLE_TAGS" = "true" ]; then
        export IMMUTABLE_IMAGE_TAG="${IMAGE_TAG}-houselab.${CI_COMMIT_SHORT_SHA}"
        export PIPELINE_IMAGE_TAG="${IMAGE_TAG}-houselab.${CI_PIPELINE_ID}"
      fi
    - docker tag "$LOCAL_IMAGE_REF" "$IMAGE_REPOSITORY:$IMAGE_TAG"
    - |
      if [ "$PUBLISH_IMMUTABLE_TAGS" = "true" ]; then
        docker tag "$LOCAL_IMAGE_REF" "$IMAGE_REPOSITORY:$IMMUTABLE_IMAGE_TAG"
        docker tag "$LOCAL_IMAGE_REF" "$IMAGE_REPOSITORY:$PIPELINE_IMAGE_TAG"
      fi
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker push "$IMAGE_REPOSITORY:$IMAGE_TAG"
    - |
      if [ "$PUBLISH_IMMUTABLE_TAGS" = "true" ]; then
        docker push "$IMAGE_REPOSITORY:$IMMUTABLE_IMAGE_TAG"
        docker push "$IMAGE_REPOSITORY:$PIPELINE_IMAGE_TAG"
      fi
    - ./ci/verify-published-digest.sh
  artifacts:
    when: on_success
    reports:
      dotenv: artifacts/image.env
    paths:
      - artifacts/image.env

manifest_validation:
  stage: manifest
  image: alpine:3.21
  needs:
    - job: verify_release
      artifacts: true
    - job: build_smoke
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $PUBLISH_IMAGE == "false"'
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache bash coreutils
  script:
    - export MANIFEST_TYPE=validation
    - set -a
    - . artifacts/release/release.env
    - . artifacts/build/build.env
    - set +a
    - |
      case "$DEPLOYMENT_ENV" in
        qa) export MANIFEST_PATH=artifacts/nextcloud-image-qa-validation.yaml ;;
        prod) export MANIFEST_PATH=artifacts/nextcloud-image-validation.yaml ;;
        *) echo "DEPLOYMENT_ENV must be qa or prod." >&2; exit 1 ;;
      esac
    - export SOURCE_PROJECT="${CI_PROJECT_PATH:-hn583/nextcloud_docker}"
    - export SOURCE_COMMIT="$CI_COMMIT_SHA"
    - export SOURCE_REF="$CI_COMMIT_REF_NAME"
    - ./ci/generate-manifest.sh
  artifacts:
    when: on_success
    paths:
      - artifacts/nextcloud-image*.yaml

manifest_published:
  stage: manifest
  image: alpine:3.21
  needs:
    - job: verify_release
      artifacts: true
    - job: build_smoke
      artifacts: true
    - job: publish_image
      artifacts: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "web" && $PUBLISH_IMAGE == "true"'
      when: on_success
    - when: never
  before_script:
    - apk add --no-cache bash coreutils
  script:
    - export MANIFEST_TYPE=published
    - set -a
    - . artifacts/release/release.env
    - . artifacts/build/build.env
    - . artifacts/image.env
    - set +a
    - |
      case "$DEPLOYMENT_ENV" in
        qa) export MANIFEST_PATH=artifacts/nextcloud-image-qa-manifest.yaml ;;
        prod) export MANIFEST_PATH=artifacts/nextcloud-image-manifest.yaml ;;
        *) echo "DEPLOYMENT_ENV must be qa or prod." >&2; exit 1 ;;
      esac
    - export SOURCE_PROJECT="${CI_PROJECT_PATH:-hn583/nextcloud_docker}"
    - export SOURCE_COMMIT="$CI_COMMIT_SHA"
    - export SOURCE_REF="$CI_COMMIT_REF_NAME"
    - ./ci/generate-manifest.sh
  artifacts:
    when: on_success
    paths:
      - artifacts/nextcloud-image*.yaml
