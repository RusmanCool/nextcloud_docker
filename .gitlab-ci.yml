stages:
  - verify
  - publish

image: docker:27.5.1

services:
  - name: docker:27.5.1-dind
    alias: docker

variables:
  DOCKER_DRIVER: overlay2
  DOCKER_HOST: tcp://docker:2376
  DOCKER_TLS_CERTDIR: /certs
  DOCKER_TLS_VERIFY: "1"
  DOCKER_CERT_PATH: "$DOCKER_TLS_CERTDIR/client"
  NEXTCLOUD_VERSION: "34.0.0"
  IMAGE_REPOSITORY: "rusman/nextcloud_cron_fmp"
  DOCKER_CONTEXT: "34/fpm"
  DOCKERFILE_PATH: "34/fpm/Dockerfile"
  RELEASE_URL: "https://download.nextcloud.com/server/releases/nextcloud-34.0.0.tar.bz2"
  RELEASE_ASC_URL: "https://download.nextcloud.com/server/releases/nextcloud-34.0.0.tar.bz2.asc"
  RELEASE_SHA256_URL: "https://download.nextcloud.com/server/releases/nextcloud-34.0.0.tar.bz2.sha256"
  NEXTCLOUD_GPG_KEY_URL: "https://nextcloud.com/nextcloud.asc"
  NEXTCLOUD_GPG_FINGERPRINT: "28806A878AE423A28372792ED75899B9A724937A"

before_script:
  - apk add --no-cache bash coreutils curl gnupg
  - docker version

verify_release:
  stage: verify
  script:
    - ./ci/verify-release.sh
  artifacts:
    when: always
    reports:
      dotenv: artifacts/release/release.env
    paths:
      - artifacts/release/release-verification.yaml

publish_image:
  stage: publish
  needs:
    - job: verify_release
      artifacts: true
  rules:
    - if: '$CI_COMMIT_TAG'
    - if: '$CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH'
    - if: '$PUBLISH_IMAGE == "true"'
      when: manual
      allow_failure: false
  script:
    - test -n "$DOCKERHUB_USERNAME"
    - test -n "$DOCKERHUB_TOKEN"
    - export IMAGE_TAG="$NEXTCLOUD_VERSION"
    - export IMMUTABLE_IMAGE_TAG="${NEXTCLOUD_VERSION}-houselab.${CI_COMMIT_SHORT_SHA}"
    - export PIPELINE_IMAGE_TAG="${NEXTCLOUD_VERSION}-houselab.${CI_PIPELINE_ID}"
    - docker build --pull --build-arg NEXTCLOUD_SHA256="$NEXTCLOUD_SHA256" --build-arg NEXTCLOUD_DOWNLOAD_URL="$RELEASE_URL" --build-arg NEXTCLOUD_ASC_URL="$RELEASE_ASC_URL" --build-arg NEXTCLOUD_GPG_KEY_URL="$NEXTCLOUD_GPG_KEY_URL" --build-arg NEXTCLOUD_GPG_FINGERPRINT="$NEXTCLOUD_GPG_FINGERPRINT" --label "org.opencontainers.image.source=$CI_PROJECT_URL" --label "org.opencontainers.image.revision=$CI_COMMIT_SHA" --label "org.opencontainers.image.version=$NEXTCLOUD_VERSION" -t "$IMAGE_REPOSITORY:$IMAGE_TAG" -t "$IMAGE_REPOSITORY:$IMMUTABLE_IMAGE_TAG" -t "$IMAGE_REPOSITORY:$PIPELINE_IMAGE_TAG" -f "$DOCKERFILE_PATH" "$DOCKER_CONTEXT"
    - IMAGE_REF="$IMAGE_REPOSITORY:$IMAGE_TAG" ./ci/smoke-test.sh
    - printf '%s' "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin
    - docker push "$IMAGE_REPOSITORY:$IMAGE_TAG"
    - docker push "$IMAGE_REPOSITORY:$IMMUTABLE_IMAGE_TAG"
    - docker push "$IMAGE_REPOSITORY:$PIPELINE_IMAGE_TAG"
    - ./ci/verify-published-digest.sh
    - . artifacts/image.env
    - export IMAGE_DIGEST IMMUTABLE_IMAGE_DIGEST PIPELINE_IMAGE_DIGEST
    - export SOURCE_PROJECT="${CI_PROJECT_PATH:-hn583/nextcloud_docker}"
    - export SOURCE_COMMIT="$CI_COMMIT_SHA"
    - export SMOKE_TESTS_PASSED=true
    - ./ci/generate-manifest.sh
  artifacts:
    when: always
    reports:
      dotenv: artifacts/image.env
    paths:
      - artifacts/image.env
      - artifacts/nextcloud-image-manifest.yaml
